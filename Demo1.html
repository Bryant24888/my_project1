<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>本地数字人 Demo（前端版，无后端）</title>
<style>
  :root{--bg:#0b1220;--card:#121a2b;--edge:#26314d;--fg:#e9eef8;--muted:#8aa0c6;--brand:#4cc9f0}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .wrap{max-width:980px;margin:40px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  h1{margin:0 0 10px 0;font-size:22px}
  .row{display:flex;gap:20px;flex-wrap:wrap}
  .avatar{flex:0 0 280px;display:grid;place-items:center;gap:8px}
  .controls{flex:1;min-width:280px;display:flex;flex-direction:column;gap:12px}
  textarea{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--edge);background:#0e1626;color:var(--fg);padding:12px;resize:vertical}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  select,input[type="range"],button{border-radius:10px;border:1px solid var(--edge);background:#0e1626;color:var(--fg);padding:10px 12px}
  button{cursor:pointer}
  .kv{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
  .subtitle{min-height:1.4em;color:var(--muted);text-align:center}
  .note{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>本地数字人 Demo（文字 → 说话+字幕）</h1>
    <div class="row">
      <div class="avatar">
        <!-- 简易头像：嘴巴用 rect 做开合动画 -->
        <svg id="face" width="240" height="240" viewBox="0 0 240 240">
          <defs>
            <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#2a64ff"/>
              <stop offset="100%" stop-color="#00d4a3"/>
            </linearGradient>
          </defs>
          <circle cx="120" cy="120" r="110" fill="url(#g)"/>
          <circle cx="88"  cy="100" r="10" fill="#0b1220"/>
          <circle cx="152" cy="100" r="10" fill="#0b1220"/>
          <rect id="mouth" x="70" y="150" width="100" height="12" rx="6" fill="#0b1220"/>
        </svg>
        <div class="subtitle" id="subtitle">（字幕会显示在这里）</div>
      </div>

      <div class="controls">
        <textarea id="text" placeholder="在这里输入要让数字人朗读的文字……">大家好，我是一位纯前端的数字人演示。你输入任何文字，我都会立刻开口说话，并显示字幕。</textarea>

        <div class="bar">
          <button id="speak">🗣️ 开口说话</button>
          <button id="pause">⏸ 暂停/继续</button>
          <button id="stop">⏹ 停止</button>
        </div>

        <div class="bar">
          <div class="kv" style="flex:1">
            声音：
            <select id="voice" style="flex:1"><option>载入中…</option></select>
          </div>
        </div>

        <div class="bar">
          <div class="kv" style="flex:1">语速
            <input id="rate" type="range" min="0.5" max="1.6" step="0.05" value="1">
            <span id="rateV" class="note">1.00</span>
          </div>
          <div class="kv" style="flex:1">音调
            <input id="pitch" type="range" min="0.6" max="1.4" step="0.05" value="1">
            <span id="pitchV" class="note">1.00</span>
          </div>
          <div class="kv" style="flex:1">音量
            <input id="vol" type="range" min="0" max="1" step="0.05" value="1">
            <span id="volV" class="note">1.00</span>
          </div>
        </div>

        <div class="note">提示：该 DEMO 使用浏览器内置的 <code>SpeechSynthesis</code>。Chrome/Edge 在 Windows 下一般提供中文声音（如“Microsoft Xiaoxiao Online (Natural) - Chinese (Mainland)”）。如列表没有中文，请更换浏览器或安装中文语音。</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ------------------ 工具与状态 ------------------ */
const elMouth = document.getElementById('mouth');
const elSub   = document.getElementById('subtitle');
const elText  = document.getElementById('text');
const elVoice = document.getElementById('voice');
const elRate  = document.getElementById('rate');
const elPitch = document.getElementById('pitch');
const elVol   = document.getElementById('vol');
const elRateV = document.getElementById('rateV');
const elPitchV= document.getElementById('pitchV');
const elVolV  = document.getElementById('volV');

let voices = [];
let currentUtter = null;
let animTimer = null;

/* 嘴型动画：简单的“开合”节奏。因为 speechSynthesis 不提供原始音频，无法用 WebAudio 真正分析能量，这里用边界事件+定时器模拟。 */
function startMouth(){
  stopMouth();
  let t = 0;
  animTimer = setInterval(()=>{
    t += 1/60;
    // 计算一个 0~1 的节奏值（随机扰动避免机械感）
    const beat = (Math.sin(t*12)+1)/2 * (0.6+Math.random()*0.4);
    const h = 8 + beat * 32; // 8~40 像素
    elMouth.setAttribute('height', h.toFixed(1));
    elMouth.setAttribute('y', (156 - h/2).toFixed(1));
  }, 1000/60);
}
function stopMouth(){
  if(animTimer){ clearInterval(animTimer); animTimer=null; }
  elMouth.setAttribute('height', 12);
  elMouth.setAttribute('y', 150);
}

/* ------------------ 语音初始化 ------------------ */
function loadVoices(){
  voices = speechSynthesis.getVoices();
  // 优先中文与自然音
  voices.sort((a,b)=>{
    const aCN = /zh|Chinese/i.test(a.lang)||/Chinese/.test(a.name);
    const bCN = /zh|Chinese/i.test(b.lang)||/Chinese/.test(b.name);
    if (aCN && !bCN) return -1;
    if (!aCN && bCN) return 1;
    return a.name.localeCompare(b.name);
  });
  elVoice.innerHTML = "";
  voices.forEach((v,i)=>{
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} [${v.lang}]`;
    elVoice.appendChild(opt);
  });
  // 自动选第一个中文
  const idx = voices.findIndex(v=>/zh|Chinese/i.test(v.lang) || /Chinese/.test(v.name));
  elVoice.value = idx>=0 ? idx : 0;
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

/* ------------------ 控件显示数值 ------------------ */
function bindRange(r, label){
  const sync = ()=>label.textContent = Number(r.value).toFixed(2);
  r.addEventListener('input', sync); sync();
}
bindRange(elRate,  elRateV);
bindRange(elPitch, elPitchV);
bindRange(elVol,   elVolV);

/* ------------------ 动作：说话 ------------------ */
function speakText(text){
  if (!text.trim()) return;
  stop(); // 先停止上一段
  elSub.textContent = text;

  const u = new SpeechSynthesisUtterance(text);
  const v = voices[Number(elVoice.value)||0];
  if (v) u.voice = v;

  u.rate  = Number(elRate.value);
  u.pitch = Number(elPitch.value);
  u.volume= Number(elVol.value);

  // 词边界事件：让字幕高亮更智能（这里简单保持整段）
  u.onstart = ()=> startMouth();
  u.onpause = ()=> stopMouth();
  u.onresume= ()=> startMouth();
  u.onend   = ()=> stopMouth();
  u.onerror = (e)=> { stopMouth(); console.error(e); alert('语音合成失败：' + e.error); };

  currentUtter = u;
  speechSynthesis.speak(u);
}

/* ------------------ 控制按钮 ------------------ */
function stop(){
  if (speechSynthesis.speaking || speechSynthesis.pending){
    speechSynthesis.cancel();
  }
  stopMouth();
  currentUtter = null;
}
function pauseOrResume(){
  if (!speechSynthesis.speaking) return;
  if (speechSynthesis.paused){
    speechSynthesis.resume(); startMouth();
  }else{
    speechSynthesis.pause();  stopMouth();
  }
}

/* ------------------ 绑定 UI ------------------ */
document.getElementById('speak').onclick = ()=> speakText(elText.value);
document.getElementById('pause').onclick = pauseOrResume;
document.getElementById('stop').onclick  = stop;

// 便捷：Ctrl+Enter 直接播报
elText.addEventListener('keydown', (e)=>{
  if (e.ctrlKey && e.key === 'Enter') speakText(elText.value);
});
</script>
</body>
</html>
